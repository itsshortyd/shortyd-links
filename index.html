<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shorty D — Official Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #141619;
    --card-bg: rgba(28, 30, 35, 0.84);
    --card-border: rgba(255, 255, 255, 0.09);
    --ink: #f5f6f8;
    --muted: #a4a9b8;
    --gold: #ffcc33;
    --gold-glow: rgba(255, 204, 51, 0.35);
    
    /* Orbit geometry */
    --radius: clamp(96px, 26vw, 145px);
    --icon-size: clamp(46px, 12vw, 58px);

    /* Atmospheric colors matched to the photo's slate & stone palette */
    --ambient-c1: rgba(142, 136, 128, 0.35);
    --ambient-c2: rgba(45, 48, 54, 0.96);
    --ambient-c3: #141619;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
    position: relative;
    background: radial-gradient(circle at 50% 48%, var(--ambient-c1) 0%, var(--ambient-c2) 65%, var(--ambient-c3) 100%);
    background-color: var(--bg-dark);
    transition: background 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Dynamic Atmosphere Themes on Hover / Tap */
  body.theme-spotify {
    --ambient-c1: rgba(30, 215, 96, 0.36);
    --ambient-c2: rgba(18, 36, 24, 0.96);
    --ambient-c3: #0a140d;
  }
  body.theme-applemusic {
    --ambient-c1: rgba(250, 35, 59, 0.36);
    --ambient-c2: rgba(45, 18, 24, 0.96);
    --ambient-c3: #14090c;
  }
  body.theme-youtube {
    --ambient-c1: rgba(255, 0, 0, 0.34);
    --ambient-c2: rgba(46, 16, 16, 0.96);
    --ambient-c3: #140808;
  }
  body.theme-instagram {
    --ambient-c1: rgba(225, 48, 108, 0.36);
    --ambient-c2: rgba(44, 18, 40, 0.96);
    --ambient-c3: #140815;
  }
  body.theme-tiktok {
    --ambient-c1: rgba(37, 244, 238, 0.3);
    --ambient-c2: rgba(15, 38, 42, 0.96);
    --ambient-c3: #071214;
  }

  /* Full-bleed Header Photo that is PART OF THE BACKGROUND and seamlessly feathers */
  .hero-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: clamp(260px, 36vh, 315px);
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom,
      #000 0%,
      #000 35%,
      rgba(0, 0, 0, 0.9) 55%,
      rgba(0, 0, 0, 0.4) 75%,
      transparent 100%);
    mask-image: linear-gradient(to bottom,
      #000 0%,
      #000 35%,
      rgba(0, 0, 0, 0.9) 55%,
      rgba(0, 0, 0, 0.4) 75%,
      transparent 100%);
  }
  .hero-backdrop-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    filter: contrast(1.08) brightness(0.96);
  }
  /* Top gradient vignette seamlessly transitioning into the photo */
  .hero-backdrop-vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(20, 22, 25, 0.92) 0%,
      rgba(20, 22, 25, 0.55) 16%,
      rgba(20, 22, 25, 0.08) 32%,
      rgba(20, 22, 25, 0) 50%,
      rgba(68, 66, 62, 0.3) 70%,
      rgba(50, 52, 56, 0.85) 90%,
      var(--bg-dark) 100%);
  }

  /* Film Grain Overlay */
  .grain-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Phone Stage Container */
  .phone-stage {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 0 18px 20px;
    text-align: center;
    margin: 0 auto;
  }

  /* Shorty D sits in the middle of the feathered transition zone */
  .feather-zone {
    width: 100%;
    padding-top: clamp(165px, 23vh, 205px);
    padding-bottom: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 5;
  }
  .artist-name {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(34px, 9vw, 44px);
    line-height: 1;
    letter-spacing: 2px;
    color: #ffffff;
    margin: 0;
    white-space: nowrap;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 204, 51, 0.35);
  }

  /* ---------- Top Stars Orbit Centerpiece ---------- */
  .orbit-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 8px 0 10px;
  }

  .orbit {
    position: relative;
    width: calc(var(--radius) * 2 + var(--icon-size));
    height: calc(var(--radius) * 2 + var(--icon-size));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 4px auto 0;
  }

  .orbit-track {
    position: absolute;
    inset: calc(var(--icon-size) / 2);
    border: 2px solid rgba(255, 204, 51, 0.35);
    border-radius: 50%;
    box-shadow: 0 0 26px rgba(255, 204, 51, 0.16), inset 0 0 26px rgba(255, 204, 51, 0.1);
    animation: orbitPulse 3.5s ease-in-out infinite alternate;
  }
  @keyframes orbitPulse {
    0% { border-color: rgba(255, 204, 51, 0.22); box-shadow: 0 0 16px rgba(255, 204, 51, 0.08); }
    100% { border-color: rgba(255, 204, 51, 0.62); box-shadow: 0 0 36px rgba(255, 204, 51, 0.4); }
  }

  .orbit-center-logo {
    width: clamp(130px, 35vw, 185px);
    height: auto;
    display: block;
    filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.88)) drop-shadow(0 0 28px rgba(255, 204, 51, 0.3));
    transition: transform 0.3s ease;
  }
  .orbit:hover .orbit-center-logo {
    transform: scale(1.04);
  }

  .orbit-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--icon-size);
    height: var(--icon-size);
    margin: calc(var(--icon-size) / -2);
    transform: rotate(var(--angle)) translateX(var(--radius)) rotate(calc(-1 * var(--angle)));
    border-radius: 50%;
    background: var(--badge);
    border: 3.5px solid rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    cursor: pointer;
    z-index: 10;
  }
  .orbit-icon svg { width: 48%; height: 48%; display: block; fill: #fff; }

  .orbit-icon:hover,
  .orbit-icon.glow {
    filter: brightness(1.22);
    box-shadow: 0 0 24px 6px var(--glow), 0 0 50px 14px var(--glow);
    transform: rotate(var(--angle)) translateX(var(--radius)) rotate(calc(-1 * var(--angle))) scale(1.22);
  }

  /* Platform message under orbit (Editor compatible) */
  .platform-label {
    margin-top: clamp(12px, 2vh, 18px);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3.5px;
    font-size: 19px;
    color: var(--ink);
    min-height: 1.3em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    transition: color 0.3s ease;
  }

  /* ---------- Latest Drop Section ---------- */
  .drop-section {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65), 0 0 25px rgba(255, 204, 51, 0.08);
    margin-bottom: 12px;
    text-align: left;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .drop-section:hover {
    border-color: rgba(255, 204, 51, 0.4);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 30px rgba(255, 204, 51, 0.16);
  }

  .drop-main-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .drop-thumb-wrap {
    width: 62px;
    height: 62px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
  }
  .drop-thumb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .drop-meta-text {
    flex: 1;
    min-width: 0;
  }
  .drop-tag-pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 2px;
  }
  .drop-title-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: #fff;
    margin: 0;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .drop-sub-text {
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Two Action Buttons */
  .drop-buttons-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .drop-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-decoration: none;
    transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
  }
  .drop-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
  }
  .drop-btn.btn-primary {
    background: #1ED760;
    color: #000;
    box-shadow: 0 4px 14px rgba(30, 215, 96, 0.35);
  }
  .drop-btn.btn-secondary {
    background: #FA233B;
    color: #fff;
    box-shadow: 0 4px 14px rgba(250, 35, 59, 0.35);
  }
  .drop-btn svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---------- Booking & Press (No Emojis) ---------- */
  .bottom-booking {
    width: 100%;
    margin-top: 2px;
    margin-bottom: 10px;
  }
  .booking-link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 11px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f1f2f6;
    text-decoration: none;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 15px;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .booking-link-btn:hover {
    background: rgba(255, 204, 51, 0.12);
    border-color: var(--gold);
    color: var(--gold);
  }
  .booking-link-btn span.email-address {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    letter-spacing: 0;
    color: var(--gold);
    margin-left: 4px;
  }

  .site-footer {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.3);
  }
</style>
</head>

<script>
  // ---- Dynamic Atmosphere Transitions ----------------------------------
  const label = document.getElementById('platformLabel');
  const DEFAULT_LABEL = label ? label.textContent.trim() : 'NEWEST DROP — "NO DAYS OFF"';
  let activeTheme = null;

  function setTheme(themeName) {
    document.body.className = themeName ? `theme-${themeName}` : 'theme-default';
  }

  function resetTheme() {
    setTheme(activeTheme);
  }

  // ---- Hover & Tap on Orbit Platform Nodes -------------------------------
  document.querySelectorAll('.orbit-icon').forEach(icon => {
    icon.addEventListener('mouseenter', () => {
      const theme = icon.dataset.theme;
      const text = icon.dataset.label;
      setTheme(theme);
      if (label && text) label.innerHTML = text;
    });

    icon.addEventListener('mouseleave', () => {
      resetTheme();
      if (label) label.innerHTML = DEFAULT_LABEL;
    });

    icon.addEventListener('click', () => {
      icon.classList.add('glow');
      setTimeout(() => icon.classList.remove('glow'), 600);
    });
  });
</script>
