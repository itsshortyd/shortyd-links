<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorty D — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2118;
    --muted: #7a6c5b;
    --cream: #f6f0e4;
    --accent: #ffcc33;
    --radius: clamp(108px, 30vw, 190px);
    --icon-size: clamp(54px, 14vw, 76px);
    --tint-soft: var(--cream);
    --tint-mid: var(--cream);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Oswald', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--tint-mid);
    transition: background .6s ease;
  }

  /* ---------- Dynamic highlight banner (crossfading, blended into the page) ---------- */
  .bg-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 88vh;
    overflow: hidden;
    z-index: 0;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-size: 170%;
    background-position: center 70%;
    opacity: .68;
    filter: brightness(1.12) saturate(1.12);
    transition: opacity .6s ease;
  }
  .bg-a { opacity: .68; }
  .bg-b { opacity: 0; }

  .bg-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,.05) 0%,
      var(--tint-soft) 88%,
      var(--tint-mid) 100%);
    transition: background .6s ease;
  }

  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(28px, 6vw, 48px) 18px 0;
    text-align: center;
  }

  /* ---------- Avatar / artist portrait ---------- */
  .avatar {
    width: clamp(190px, 56vw, 320px);
    height: clamp(190px, 56vw, 320px);
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 16px 40px rgba(43,33,24,.35);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .artist-name {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(40px, 11vw, 60px);
    line-height: 1;
    margin: 20px 0 0;
    letter-spacing: 1px;
    color: #000;
    text-shadow: 0 3px 14px rgba(43,33,24,.18);
  }

  /* ---------- Orbit stage ---------- */
  .orbit {
    position: relative;
    width: calc(var(--radius) * 2 + var(--icon-size));
    height: calc(var(--radius) * 2 + var(--icon-size));
    margin: clamp(34px, 8vw, 56px) auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orbit-track {
    position: absolute;
    inset: calc(var(--icon-size) / 2);
    border: 1px dashed rgba(43, 33, 24, .18);
    border-radius: 50%;
  }

  /* the actual Top Stars overlay video, spinning on its own */
  .orbit-logo-img {
    width: clamp(170px, 46vw, 260px);
    height: auto;
    display: block;
    filter: drop-shadow(0 12px 26px rgba(43,33,24,.3));
  }

  .orbit-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--icon-size);
    height: var(--icon-size);
    margin: calc(var(--icon-size) / -2);
    transform: rotate(var(--angle)) translateX(var(--radius)) rotate(calc(-1 * var(--angle)));
    border-radius: 50%;
    background: var(--badge);
    border: 3px solid rgba(255,255,255,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }

  .orbit-icon svg { width: 50%; height: 50%; display: block; fill: #fff; }

  .orbit-icon:hover,
  .orbit-icon:focus-visible,
  .orbit-icon.glow {
    filter: brightness(1.12);
    box-shadow: 0 0 16px 3px var(--glow), 0 0 40px 10px var(--glow);
    transform: rotate(var(--angle)) translateX(var(--radius)) rotate(calc(-1 * var(--angle))) scale(1.16);
  }

  .platform-label {
    margin-top: clamp(22px, 5vw, 34px);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    font-size: 22px;
    color: var(--ink);
    min-height: 1.4em;
    transition: opacity .2s ease;
  }

  .hint {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 4px 0 0;
  }

  footer {
    position: relative;
    z-index: 2;
    margin: clamp(36px, 8vw, 56px) 0 28px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>

<script>
  // ---- Background image map -------------------------------------------
  // Swap any of these paths to point at a different cover/thumbnail.
  // Whatever isn't set falls back to DEFAULT_BG ("newest work").
  const DEFAULT_BG = 'assets/no-days-off-cover.jpg';
  const DEFAULT_LABEL = 'NEWEST DROP — "NO DAYS OFF"';

  const bgA = document.getElementById('bgA');
  const bgB = document.getElementById('bgB');
  const label = document.getElementById('platformLabel');
  let showingA = true;

  bgA.style.backgroundImage = `url('${DEFAULT_BG}')`;

  // ---- Dynamic tint -----------------------------------------------------
  // Each background image has a matching `data-tint` hex color (its
  // dominant tone) right next to its `data-bg` on the orbit-icon links.
  // We blend that color faintly into the page background so everything
  // picks up a hint of that image's flavor instead of staying flat white.
  // (Pre-computed per-image rather than sampled live, so it works the same
  // whether the page is opened straight from disk or hosted online.)
  const CREAM_RGB = [246, 240, 228];
  const DEFAULT_TINT = '#a02e18';

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, t) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * t));
  }
  function rgbStr(rgb) { return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`; }

  function applyTint(hex) {
    const rgb = hexToRgb(hex || DEFAULT_TINT);
    document.documentElement.style.setProperty('--tint-soft', rgbStr(mix(CREAM_RGB, rgb, .32)));
    document.documentElement.style.setProperty('--tint-mid', rgbStr(mix(CREAM_RGB, rgb, .54)));
  }

  applyTint(DEFAULT_TINT);

  function setHighlight(url, text, tint) {
    const targetUrl = url || DEFAULT_BG;
    label.textContent = text || DEFAULT_LABEL;
    applyTint(tint || DEFAULT_TINT);

    const front = showingA ? bgA : bgB;
    const back = showingA ? bgB : bgA;
    if (front.style.backgroundImage !== `url("${targetUrl}")`) {
      back.style.backgroundImage = `url('${targetUrl}')`;
      back.style.opacity = '1';
      front.style.opacity = '0';
      showingA = !showingA;
    }
  }

  document.querySelectorAll('.orbit-icon').forEach(icon => {
    const bg = icon.dataset.bg;
    const text = icon.dataset.label;
    const tint = icon.dataset.tint;

    icon.addEventListener('mouseenter', () => setHighlight(bg, text, tint));
    icon.addEventListener('focus', () => setHighlight(bg, text, tint));
    icon.addEventListener('mouseleave', () => setHighlight(DEFAULT_BG, DEFAULT_LABEL, DEFAULT_TINT));
    icon.addEventListener('blur', () => setHighlight(DEFAULT_BG, DEFAULT_LABEL, DEFAULT_TINT));

    // "glow up" pulse right as the link opens in a new tab
    icon.addEventListener('click', () => {
      icon.classList.add('glow');
      setTimeout(() => icon.classList.remove('glow'), 700);
    });
  });
</script>
